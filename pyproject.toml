[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyhft"
version = "0.1.0"
description = "Python bindings for HFT shared-memory readers"
requires-python = ">=3.11"

[tool.scikit-build]
wheel.packages = ["src/pyhft"]
cmake.build-type = "Release"
